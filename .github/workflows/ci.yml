name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test & build xb-hub (amd64 & arm64)
        working-directory: hub
        run: |
          go test ./...
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build -o ../dist/xb-hub-linux-amd64 ./cmd/xb-hub
          GOOS=linux GOARCH=arm64 go build -o ../dist/xb-hub-linux-arm64 ./cmd/xb-hub

  test-and-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test win-host & build release installer
        run: |
          cd win-host
          go test ./...
          cd ..
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -SkipAndroid

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon
