name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test & build xb-hub
        working-directory: hub
        run: |
          go test ./...
          go build -o ../dist/xb-hub-linux-amd64 ./cmd/xb-hub

  test-and-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test & build win-host
        working-directory: win-host
        run: |
          go test ./...
          mkdir ..\dist -Force | Out-Null
          go build -o ..\dist\xb-host.exe .\cmd\xb-host
      - name: Build win-media
        working-directory: win-media
        run: cmd /c build.bat

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon
